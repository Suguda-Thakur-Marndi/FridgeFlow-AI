services:
  - type: web
    name: fridgeflow-ai-api
    runtime: docker
    region: singapore
    plan: starter
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: GEMMA_MODEL_NAME
        value: gemma3:4b
      - key: FORCE_MOCK_VISION
        value: "false"
      - key: OLLAMA_HOST
        value: http://localhost:11434
